name: Construir plugin Medidores EQ
# Solo a mano (pestaña Actions → Run workflow): los minutos de macOS cuentan x10.
on:
  workflow_dispatch:
    inputs:
      universal:
        description: 'Compilar también para Intel (tarda más)'
        type: boolean
        default: false
concurrency:
  group: build-plugin
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      ARCHS: ${{ inputs.universal && 'arm64;x86_64' || 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ env.ARCHS }}
          max-size: 500M
      - name: Configurar
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=$ARCHS"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
      - name: Compilar (solo AU y VST3)
        run: cmake --build build --config Release --parallel --target MedidoresEQ_AU MedidoresEQ_VST3
      - name: Validar el Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MedidoresEQ_artefacts/Release/AU/Medidores EQ.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Meq1 Polv || { echo "auval falló"; sleep 10; ls ~/Library/Logs/DiagnosticReports; cat ~/Library/Logs/DiagnosticReports/auval* 2>/dev/null | head -80; exit 1; }
      - name: Validar con pluginval (VST3)
        continue-on-error: true
        run: |
          curl -sL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --output-dir pluginval-log "build/MedidoresEQ_artefacts/Release/VST3/Medidores EQ.vst3"
      - name: Empaquetar
        run: |
          cd build/MedidoresEQ_artefacts/Release
          ditto -c -k --keepParent "AU/Medidores EQ.component" "$GITHUB_WORKSPACE/MedidoresEQ-AU.zip"
          ditto -c -k --keepParent "VST3/Medidores EQ.vst3" "$GITHUB_WORKSPACE/MedidoresEQ-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MedidoresEQ
          path: MedidoresEQ-*.zip
          retention-days: 14
